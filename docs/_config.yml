# GitHub Pages site for design-os-generative-ui, built from this docs/ folder.
# _layouts/default.html wraps every Markdown page in the landing's design language;
# index.html is a hand-built page (layout: null) sharing assets/site.css.
# jekyll-seo-tag emits <title>, <meta name="description">, Open Graph and JSON-LD;
# jekyll-sitemap emits sitemap.xml for Google Search Console.
title: design-os-generative-ui
description: Open-source generative UI runtime and guidelines for Claude Artifacts, ChatGPT Canvas, and Gemini: streaming HTML sanitizer, morphdom diffing, Chart.js, KaTeX, Mermaid, and Three.js.
url: https://jangtrinh.github.io
baseurl: /design-os-generative-ui
lang: en
repository: jangtrinh/design-os-generative-ui
repository_url: https://github.com/jangtrinh/design-os-generative-ui
wordmark: DESIGN:OS
wordmark_url: https://jangtrinh.github.io/design-os/
eyebrow: DESIGN:OS · Runtime          # short product family label, e.g. design:os
logo: /images/cover.png          # a real capture under docs/images/
nav:                        # one entry per Markdown page under docs/, in reading order
  - { title: Deep dive, url: /deep-dive.html }
footer:
  - { title: GitHub, url: https://github.com/jangtrinh/design-os-generative-ui }
  - { title: MIT, url: https://github.com/jangtrinh/design-os-generative-ui/blob/main/LICENSE }
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "google*.html" }
    values: { sitemap: false }
